name: Daily Market Report

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force send even if the report date looks stale"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "12 1 * * 2-6"

permissions:
  contents: write

concurrency:
  group: daily-market-report
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send Feishu report
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          if [ "${{ github.event.inputs.force_send }}" = "true" ]; then
            python main.py --force
          else
            python main.py --write-sent-state
          fi

      - name: Commit sent state
        run: |
          if git diff --quiet -- data/daily_market; then
            echo "No daily sent state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_market
          git commit -m "Update daily market sent state"
          git push
